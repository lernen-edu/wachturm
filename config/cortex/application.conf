# Wachturm — Cortex 3.1.8 configuration
# Mounted read-only at /etc/cortex/application.conf (docker-compose.yml).
#
# Scope: P2-M0 needs Cortex to boot, reach its own Elasticsearch
# datastore (cortex-es:9200), and serve its API on :9001 so the stack
# is "healthy". Analyzer wiring (AbuseIPDB / WHOIS / MISP placeholder),
# the IRIS<->Cortex linkage, and the Docker job-runner block are authored
# in P2-M4 — they are NOT needed for the M0 health gate and are
# deliberately left out here rather than guessed at.

# ── Play application secret ──────────────────────────────────────────
# NEVER commit a real secret (AGENTS.md §6.3). This is a safe-but-
# insecure sealed-lab default, identical in spirit to the IRIS_*
# placeholders in docker-compose.yml; override it by setting
# CORTEX_PLAY_SECRET in .env (compose passes it into the container and
# the ${?...} override line below then wins over the literal default).
play.http.secret.key = "changeme_in_env"
play.http.secret.key = ${?CORTEX_PLAY_SECRET}

# ── Datastore: Elasticsearch (Cortex's OWN es; never Wazuh's indexer) ─
# cortex-es runs xpack.security.enabled=false (docker-compose.yml), so
# no credentials are needed on the URI. nbreplicas=0 keeps a single-node
# ES out of perpetual "yellow" from unassigned replica shards.
search {
  index = cortex
  uri = "http://cortex-es:9200"
  keepalive = 1m
  pagesize = 50
  nbshards = 5
  nbreplicas = 0
}

# ── Analyzer / responder catalogs ────────────────────────────────────
# P2-M4: Cortex fetches the official analyzer catalog at boot. This is
# the ONE sanctioned Cortex egress (the documented exception in the
# compose network-model note): cortex is on the mgmt network (NOT
# internal), download.thehive-project.org publishes the analyzer
# definitions, and the analyzer neuron images (cortexneurons/*) are
# pulled on first run. A local-path value here throws
# `MalformedURLException: no protocol` (Cortex treats urls entries as
# URLs unless they resolve to an existing directory) and leaves the
# catalog empty — verified against the running 3.1.8 image in M0.
analyzer {
  urls = ["https://download.thehive-project.org/analyzers.json"]
  fork-join-executor {
    parallelism-min = 2
    parallelism-factor = 2.0
    parallelism-max = 4
  }
}

# Responders (active response) are out of Phase-2 scope — Phase 4+. The
# image entrypoint generates a temp config that ends with
# `include file("/etc/cortex/application.conf")`, so (HOCON last-wins)
# this empty list overrides the entrypoint's DEFAULT_RESPONDER_URL: the
# lab ships ZERO responders and skips an otherwise-unused catalog fetch.
# Verified live in M4: responderdefinition count = 0, boot log clean.
responder {
  urls = []
  fork-join-executor {
    parallelism-min = 2
    parallelism-factor = 2.0
    parallelism-max = 4
  }
}

# ── Analyzer result cache ────────────────────────────────────────────
# Re-running the same analyzer on the same observable within this window
# returns the cached job instead of a fresh call. Load-bearing for the
# AbuseIPDB free-tier limit (1000 req/day) once analyzers land in P2-M4.
cache.job = 10 minutes

# ── Authentication ───────────────────────────────────────────────────
# Local auth only; the first admin user is created via the Cortex
# bootstrap/migration in P2-M4. No SSO in a sealed lab.
auth {
  provider = [local]
}

# ── Analyzer Docker job-runner ───────────────────────────────────────
# Cortex 3.1.8 runs each analyzer as a transient neuron container via
# the mounted docker.sock. It writes the job's input.json under
# `job.directory` (inside this container), then asks the HOST docker to
# bind `job.dockerDirectory`/<jobid> into the neuron as /job. The host
# daemon resolves that path on the HOST, so the in-container path and
# the host path must be identical — docker-compose.yml binds
# /tmp/cortex-jobs:/tmp/cortex-jobs for exactly this (the official
# TheHive-Project/Cortex compose pattern). We pin job.directory here
# because our application.conf is mounted read-only, so the image
# entrypoint's `echo job.directory=… >> CONFIG` cannot take effect.
# reference.conf already defaults job.dockerDirectory = ${job.directory}
# and runners = [docker, process], which is correct once the paths
# match — verified end-to-end against the running 3.1.8 image in M4.
job {
  directory = "/tmp/cortex-jobs"
}
