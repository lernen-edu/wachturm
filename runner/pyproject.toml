# Wachturm runner — packaging and tooling config.
#
# Phase 0: skeleton only. The scenario runner, scoring engine, and
# integrations are implemented in later phases (see BUILD_ORDER.md).

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wachturm"
description = "Wachturm — Tier 1 SOC analyst simulator: scenario runner and scoring CLI."
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Wachturm Contributors" }]
dynamic = ["version"]
dependencies = [
    "typer>=0.12,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.5,<3.0",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.6,<1.0",
    "mypy>=1.8,<3.0",
    "types-PyYAML>=6,<7",
    "pre-commit>=3.7,<5",
]

[project.scripts]
wachturm = "wachturm.cli:main_entrypoint"

[tool.setuptools.dynamic]
version = { attr = "wachturm.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
