# Wachturm portal — nginx config
#
# Serves the static landing page and proxies /api/health/* endpoints to each
# tool's container over the wachturm-mgmt network. This dodges CORS, since
# the browser only ever talks to the portal's own origin.

# NOTE: no `upstream {}` blocks. nginx resolves names in upstream
# blocks (and in a literal proxy_pass host) at *startup*, so any tool
# from a not-yet-deployed profile (iris/cortex/shuffle/misp) would abort
# nginx with "host not found in upstream" and crash-loop the portal in a
# core-only Phase-1 deployment. Instead each health proxy uses a
# variable + the embedded `resolver` below, deferring DNS to request
# time: an absent tool then fails fast to 502 -> @down (handled), not a
# boot failure. This is what the `resolver` line was always for.
server {
    listen       80 default_server;
    server_name  _;
    resolver     127.0.0.11 valid=30s;  # Docker embedded DNS

    root  /usr/share/nginx/html;
    index index.html;

    # Static landing page
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health proxies — each returns 2xx if tool is reachable, 502/504 if not.
    # The browser JS treats anything non-2xx as "down".

    location = /api/health/wazuh {
        set $u wazuh-dashboard;
        proxy_pass               https://$u:5601/;
        proxy_ssl_verify         off;
        proxy_connect_timeout    2s;
        proxy_read_timeout       3s;
        proxy_intercept_errors   on;
        error_page 500 502 503 504 = @down;
    }

    location = /api/health/iris {
        set $u iris-nginx;
        proxy_pass               https://$u:8443/;
        proxy_ssl_verify         off;
        proxy_connect_timeout    2s;
        proxy_read_timeout       3s;
        proxy_intercept_errors   on;
        error_page 500 502 503 504 = @down;
    }

    location = /api/health/cortex {
        set $u cortex;
        proxy_pass               http://$u:9001/api/status;
        proxy_connect_timeout    2s;
        proxy_read_timeout       3s;
        proxy_intercept_errors   on;
        error_page 500 502 503 504 = @down;
    }

    location = /api/health/shuffle {
        set $u shuffle-frontend;
        proxy_pass               http://$u:80/;
        proxy_connect_timeout    2s;
        proxy_read_timeout       3s;
        proxy_intercept_errors   on;
        error_page 500 502 503 504 = @down;
    }

    location = /api/health/misp {
        set $u misp;
        proxy_pass               http://$u:80/users/login;
        proxy_connect_timeout    2s;
        proxy_read_timeout       3s;
        proxy_intercept_errors   on;
        error_page 500 502 503 504 = @down;
    }

    location @down {
        default_type application/json;
        return 503 '{"status":"down"}';
    }

    # Scenario state. Phase-1 stub: the runner docker-cp's a state.json
    # snapshot here after each run; Phase 3 streams live state
    # (BUILD_ORDER:155-156). Before any run the file is absent — fall
    # back to a real empty-object 200. (`try_files ... =200` closes the
    # connection with NO response in this nginx — curl 52 — so the JS
    # fetch rejects rather than parsing `{}`; a named @nostate returns
    # an actual body, which is what the stub always intended.)
    location = /api/state {
        default_type application/json;
        try_files /state.json @nostate;
    }
    location @nostate {
        default_type application/json;
        return 200 '{}';
    }
}
