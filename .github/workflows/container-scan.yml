# .github/workflows/container-scan.yml
#
# Builds the project's custom container images and scans them with Trivy
# for known CVEs and misconfigurations. Runs on PRs that touch image
# directories, on every push to main, and weekly.
#
# Upstream images (Wazuh, IRIS, Cortex) are NOT scanned here — those are
# maintained by their respective projects, pinned in docker-compose.yml,
# and tracked via Dependabot for version bumps.
#
# ── Finding-triage policy (read before reacting to a red run) ────────
# This job has two distinct "failure" sources; do not conflate them:
#
#   1. Trivy CVE findings. The Trivy step uses `ignore-unfixed: true` and
#      `exit-code: 0`, so it NEVER fails the job on CVEs — findings are
#      informational SARIF only. Triage rule: a CVE in a base image
#      (ubuntu/debian/python/nginx/Wazuh-agent) with no upstream fix →
#      note in the phase handoff and proceed (we can't patch upstream).
#      A finding introduced by our own Dockerfile RUN steps or config
#      (e.g. a tool we install, our local_rules.xml) → fix it.
#
#   2. The "Upload SARIF" step. It posts to GitHub code scanning, which
#      requires GitHub Advanced Security. The private wachturm-source repo
#      does not have GHAS, so the upload is now SKIPPED there by an
#      `if:` on github.repository, and findings are summarised into the
#      job log instead. The public mirror still uploads normally.
#
# A red container-scan is therefore a real problem again — it is no
# longer masked by an expected GHAS failure. Two long-standing bugs that
# made every run red regardless of image content were fixed at the same
# time as the upload gate:
#
#   - the SARIF output path was `trivy-wachturm/<name>.sarif`, built from
#     the slash-containing image tag, so Trivy tried to write into a
#     directory that did not exist and ALL 11 scans died with
#     "no such file or directory"
#   - the build context was assumed to be ./images/<name>, which is wrong
#     for wazuh-to-iris (it COPYs runner/ and builds from the repo root),
#     so that image failed with `"/runner": not found`. Context and
#     dockerfile are now read from docker-compose.yml, keeping this job
#     and `docker compose build` in agreement by construction.

name: Container scan

on:
  push:
    branches: ["main"]
    paths:
      - "images/**"
      - ".github/workflows/container-scan.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "images/**"
      - ".github/workflows/container-scan.yml"
  schedule:
    - cron: "0 8 * * 1"  # Weekly Monday 08:00 UTC

permissions:
  contents: read
  security-events: write   # to upload SARIF results

jobs:
  discover:
    name: Discover image directories
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        name: Enumerate buildable images
        run: |
          # Each subdirectory of images/ containing a Dockerfile is a
          # buildable image. The build CONTEXT is taken from
          # docker-compose.yml rather than assumed to be the image
          # directory: wazuh-to-iris builds from the repo root (its
          # Dockerfile COPYs runner/), so assuming ./images/<name> made it
          # fail with `"/runner": not found` on every run.
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, yaml

          with open("docker-compose.yml") as fh:
              compose = yaml.safe_load(fh)

          # dockerfile path -> {context, dockerfile}, as compose declares it
          by_dockerfile = {}
          for svc in (compose.get("services") or {}).values():
              build = svc.get("build")
              if not build:
                  continue
              if isinstance(build, str):
                  ctx, dockerfile = build, os.path.join(build, "Dockerfile")
              else:
                  ctx = build.get("context", ".")
                  dockerfile = build.get("dockerfile", "Dockerfile")
                  if not os.path.isabs(dockerfile) and not dockerfile.startswith(ctx.rstrip("/")):
                      dockerfile = os.path.join(ctx, dockerfile)
              by_dockerfile[os.path.normpath(dockerfile)] = (os.path.normpath(ctx), os.path.normpath(dockerfile))

          images = []
          for entry in sorted(os.listdir("images")):
              dockerfile = os.path.join("images", entry, "Dockerfile")
              if not os.path.isfile(dockerfile):
                  continue
              ctx, df = by_dockerfile.get(
                  os.path.normpath(dockerfile),
                  (os.path.join("images", entry), dockerfile),
              )
              images.append({
                  # slug is filename-safe: it feeds the SARIF path and the
                  # code-scanning category, neither of which may contain "/".
                  "slug": entry,
                  "tag": f"wachturm/{entry}",
                  "context": ctx,
                  "dockerfile": df,
              })

          print("images=" + json.dumps(images))
          PY
          echo "Discovered:"; jq -r '.[] | "  \(.slug): context=\(.context) dockerfile=\(.dockerfile)"' \
            <<<"$(grep '^images=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)"

  scan:
    name: Scan ${{ matrix.image.slug }}
    needs: discover
    runs-on: ubuntu-latest
    if: ${{ needs.discover.outputs.images != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.discover.outputs.images) }}

    steps:
      - uses: actions/checkout@v7

      # context/dockerfile come from docker-compose.yml via the discover job,
      # so images that build from the repo root (wazuh-to-iris) work the same
      # way here as they do under `docker compose build`.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          push: false
          load: true
          tags: ${{ matrix.image.tag }}:scan-${{ github.sha }}

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.image.tag }}:scan-${{ github.sha }}
          format: sarif
          # matrix.image.slug, NOT the wachturm/-prefixed tag: the tag
          # contains a "/", so the old `trivy-wachturm/<name>.sarif` asked
          # Trivy to write into a directory that does not exist. That single
          # character failed all 11 scans on every run.
          output: trivy-${{ matrix.image.slug }}.sarif
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true   # don't fail on CVEs with no upstream fix
          exit-code: "0"         # report findings, don't fail the job

      # Code scanning upload needs Advanced Security, which the private
      # source repo does not have. Same runtime switch as codeql.yml: the
      # public mirror uploads, the private source surfaces findings in the
      # job log instead. See codeql.yml for the full rationale.
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4.37.4
        if: ${{ always() && github.repository == 'lernen-edu/wachturm' }}
        with:
          sarif_file: trivy-${{ matrix.image.slug }}.sarif
          category: "trivy-${{ matrix.image.slug }}"

      - name: Summarise findings (no code scanning UI on private source)
        if: ${{ always() && github.repository != 'lernen-edu/wachturm' }}
        run: |
          f="trivy-${{ matrix.image.slug }}.sarif"
          [ -f "$f" ] || { echo "no SARIF produced for ${{ matrix.image.slug }}"; exit 0; }
          n=$(jq '[.runs[].results[]?] | length' "$f")
          echo "${{ matrix.image.slug }}: $n CRITICAL/HIGH fixable finding(s)"
          # Informational only, matching the triage policy in this file's
          # header: base-image CVEs we cannot patch must not gate the build.
          jq -r '.runs[].results[]? | "  \(.ruleId): \(.message.text | split("\n")[0])"' "$f" | head -40
